# Negative tests for nuggs-coupling.scad's guards — each line is a parameter set
# the library must REFUSE. Run by scripts/guard-check.sh (via check.sh); format
# and the reason this file exists are documented there.
#
#   <case name> | <expected message substring> | <statement>
#
# Almost every failure this library can have is SILENT. The bayonet is a fit
# between two copies of one part, so a wrong parameter does not produce a broken
# render — it produces a watertight, one-body, sliceable, 100/100-scoring part
# that simply will not go together, or goes together and does not hold. That is
# why these cases exist as a manifest rather than as comments: a firing assert
# aborts the render it lives in, so nothing else in the repo can prove a guard
# still refuses what it was written to refuse.
#
# ONE GUARD IS NOT REPRESENTED HERE and cannot be: the circ_clr identity pin
# (abs(circ_clr - port_tol) < 1e-6) fires only if someone rewrites the
# derivation itself, so there is no legal parameter set that reaches it. Its
# sibling, the 5% loose-end bound, IS reachable and is the last case below.

# ---------------------------------------------------------------------------
# Welfare and printability
# ---------------------------------------------------------------------------

# The bore floor is the one number in the library that is not an engineering
# trade, and it is the one whose failure mode never shows up in a render: a
# pouched animal wedging in a too-narrow bore is an injury that happens weeks
# after a part that gated 100/100. Kept as a hard assert on the owner's ruling.
bore-floor | NUGGS BORE FLOOR | nuggs_port(nuggs_cfg(bore_d = 69));

# ro = bore_d/2 + wall is the datum every coupling radius is measured from, so a
# wall thinner than three perimeters is not just a weak tube — it moves the
# whole coupling ring inward while every clearance stays nominal.
thin-wall | NUGGS WALL | nuggs_port(nuggs_cfg(wall = 1.0));

# ---------------------------------------------------------------------------
# The three bounds that make the joint possible
# ---------------------------------------------------------------------------

# The genderless condition in its twisted form. lug_deg = 50 renders and gates
# perfectly: 50 + 14 = 64 against a pitch/2 of 60, so the part is physically
# impossible to twist shut and nothing in a mesh check can tell you that. Free
# travel is pitch/2 - lug_deg, not pitch - lug_deg — the looser form was the
# original bug.
bayonet-clearance | NUGGS BAYONET CLEARANCE | nuggs_port(nuggs_cfg(lug_deg = 50));

# Bayonet travel: the rib has to reach from the entry slot to somewhere still
# inside the circumferential run. At rib_deg = 30 (30 + 14 = 44 against a 40 deg
# sector) the rib runs off the end of the mate's sector and retains nothing —
# again, a clean render of a joint that falls apart.
bayonet-travel | NUGGS BAYONET TRAVEL | nuggs_port(nuggs_cfg(rib_deg = 30));

# twist_deg = 0 is legal arithmetic and a dead joint: nuggs_clockings()
# collapses to [60, 60, 60], so there is nowhere to twist to. It changes NO
# geometry at all — twist_deg is read only by guards and by nuggs_clockings() —
# so a reviewer diffing meshes would see nothing whatsoever.
twist-zero | NUGGS TWIST | nuggs_port(nuggs_cfg(twist_deg = 0));

# ---------------------------------------------------------------------------
# The fit knob
# ---------------------------------------------------------------------------

# port_tol outside the band the coupon can actually tune.
port-tol-band | NUGGS PORT_TOL: | nuggs_port(nuggs_cfg(port_tol = 0.70));

# THE MEASURED SILENT FAILURE, and the reason this guard was added at extraction
# rather than carried over. designs/nuggs asserted `rib_h < lug_r/2 - 0.4`,
# which admits rib_h = 2.5. At 2.5 the inner sector's web — the material left
# between the groove floor and the sector's bore-side face — is -0.10 mm: the
# entry slot cuts clean THROUGH the projecting sector. Measured: watertight, ONE
# body, 39764.8 mm3 against 41784.5, and check.sh, gate.sh, printcheck and the
# mate test were all green.
web-severed | NUGGS WEB | nuggs_port(nuggs_cfg(rib_h = 2.5));

# THE BOUNDARY, refusing half. The bound is two extrusion widths at the
# configured nozzle, and at port_tol = 0.60 — the top of the documented band —
# the shipped rib_h = 1.0 lands the web at exactly 0.80 mm, i.e. exactly on it.
# So the knob a user is invited to turn already reaches the edge of this guard,
# and one notch of rib_h past it must be refused. Its accepting partner (web ==
# 0.80 must RENDER) is specimen 5 in lib/nuggs-coupling-demo.scad, because a
# guard manifest can only express refusals. The expected substring is the
# derived floor rather than the complaint, which ties the message to 2*nozzle:
# a guard that quietly became a hardcoded 0.8 would still pass a match on
# "NUGGS WEB" and fail here.
web-boundary | under the 0.8 mm two-extrusion floor | nuggs_port(nuggs_cfg(rib_h = 1.05, port_tol = 0.60));

# The entry slot must not consume the sector it is cut into. BAYONET TRAVEL
# above only implies this while twist_deg >= 2*tol_a, and nothing forbids a
# smaller twist: at lug_deg = 20, rib_deg = 19.7, twist_deg = 0.3 the travel
# bound passes exactly (20 <= 20) while the slot comes out 20.477 deg wide
# against a 20 deg sector and severs it.
slot-severs-sector | NUGGS SLOT | nuggs_port(nuggs_cfg(lug_deg = 20, rib_deg = 19.7, twist_deg = 0.3));

# The loose end of the engagement band. rib_h is what sets the band's radial
# depth, and past ~5% of rib_in one angular width can no longer deliver the same
# millimetre gap at both ends of it. lug_r = 10 widens the ring enough that the
# WEB guard above stops catching this first (web = 0.90, comfortably legal),
# which is the only way to reach this bound with an otherwise valid part: the
# realised clearance runs 0.300 at rib_in = 43.75 and 0.324 at i_out = 47.25,
# 8.0% apart.
band-too-deep | more than 5% over | nuggs_port(nuggs_cfg(lug_r = 10, rib_h = 3.5));

# ---------------------------------------------------------------------------
# Radial budget — three bounds designs/nuggs stated as comments and never checked
# ---------------------------------------------------------------------------

# The rib's fusing overlap must not push its outer face past the ring OD.
# Nothing mates out there, and a proud rib breaks the snag-free outer surface
# the whole system depends on.
rib-past-ring-od | NUGGS RIB OD | nuggs_port(nuggs_cfg(bite = 3.0));

# The backing collar must stop SHORT of the outer sectors' OD so it never shares
# a cylindrical surface with the sectors it overlaps. designs/nuggs said so in a
# comment ("stops short of r_out so it never shares a surface") and enforced
# nothing; a shared cylindrical surface is precisely how this geometry produces
# non-watertight meshes.
collar-reaches-ring-od | NUGGS COLLAR OD | nuggs_port(nuggs_cfg(collar_bite = 2.9));

# The anchoring bite is how far the collar and the inner sectors reach inboard
# of ri to fuse with the tube. Past the wall thickness they are reaching through
# nothing, and the "anchored" sectors are held by the bore cut's leftovers.
anchor-bite-past-wall | NUGGS ANCHOR BITE | nuggs_port(nuggs_cfg(anchor_bite = 3.0));

# A rib deeper than the whole inner band leaves no groove floor to cut.
rib-past-tube-od | NUGGS RIB DEPTH | nuggs_port(nuggs_cfg(lug_r = 8, rib_h = 5.0));

# ---------------------------------------------------------------------------
# Shape of the ring
# ---------------------------------------------------------------------------

# One sector per face is a one-sided coupling, not a joint.
one-lug | NUGGS N_LUG | nuggs_port(nuggs_cfg(n_lug = 1));

# split is the fraction of lug_r given to the inner band. designs/nuggs hardcoded
# it as a `/2`; exposed, it needs a bound, or a zero-width band renders as a
# coupling with no inner shell at all.
split-degenerate | NUGGS SPLIT | nuggs_port(nuggs_cfg(split = 0));

# ---------------------------------------------------------------------------
# The three module-level guards — the caller-obligation footguns
# ---------------------------------------------------------------------------

# A bore cut may only ever open the bore up, never neck it down. Passing a
# smaller radius is how a caller "fixes" a fouled bore by leaving a lip in it.
bore-cut-necks-bore | NUGGS BORE CUT | nuggs_bore_cut(nuggs_cfg(), -11, 20, r = 30);

# A port face backed by less than z_top of full-round shell has inner sectors
# fused to nothing. 10 mm against a z_top of 13.
neck-too-short | NUGGS NECK | nuggs_neck(nuggs_cfg(), 10);

# A window that reaches into the port zone leaves the port's inner sectors fused
# to a window EDGE instead of a ring; they snap off in the hand and the mesh
# never says a word. z0 = 5 against a z_top of 13.
window-into-neck | cuts into the port zone | nuggs_window(nuggs_cfg(), 5, 40, 180);

# A window wider than 280 deg eats into the walk band (+/-40 deg about the
# invert). An open module's whole claim is that its floor IS the ri arc, so that
# a round mate's bore is continuous with it to 0.000 mm at every lateral
# position; a window through the floor withdraws that claim silently.
window-eats-walk-band | eats into the walk band | nuggs_window(nuggs_cfg(), 13, 40, 300);
