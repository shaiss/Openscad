# Positive tests for threads-fdm.scad: pairs that must ASSEMBLE, and one that
# must not. Run by scripts/mate-check.sh (via check.sh); the format and the
# reason this file exists are documented there.
#
# Each statement builds the interference solid — the male neck intersected with
# the lid it screws into. A pair that fits leaves that intersection empty.
#
# The lid is built the way thread_bore_cut()'s own doc says it must be: the
# MANDATORY minor bore, then the groove cutter. Omit the minor bore and the lid
# is a solid plug, the intersection is enormous, and the case fails loudly —
# which is the documented footgun being held down by a test.
#
# <case name> | empty|interfering | <statement producing the interference>

# The desiccant-capsule's own numbers, at its shipped clearance. This is the
# case issue #37 was about: before the profile fix the flanks ran at 36.87 deg
# and delivered 0.2794 of a promised 0.300.
capsule-fit | empty | intersection() { thread_neck(28, 1.2, 4, 2, 9); difference() { cylinder(d = 36, h = 11); translate([0, 0, -0.01]) cylinder(d = 28 - 2 * 1.2 + 2 * 0.3, h = 11.02); thread_bore_cut(28, 1.2, 4, 2, 9, 0.3, over = 0.4); } }

# A different parameter set entirely — single start, finer pitch, smaller neck,
# tighter tolerance — so the fit is not proven only at the one size the library
# was extracted from. Flank clearance scales with depth, and this depth is half
# the capsule's, which is where the old profile's error was worst (15% tight).
fine-fit | empty | intersection() { thread_neck(16, 0.6, 3, 1, 10); difference() { cylinder(d = 24, h = 12); translate([0, 0, -0.01]) cylinder(d = 16 - 2 * 0.6 + 2 * 0.25, h = 12.02); thread_bore_cut(16, 0.6, 3, 1, 10, 0.25, over = 0.4); } }

# THE NEGATIVE CONTROL. tol = 0 is legal — the guard only refuses tol < 0 — and
# makes the female cutter exactly the male thread, so the two must collide. If
# this ever reports 0 facets the harness has stopped measuring anything and the
# two cases above are worthless.
zero-tol-binds | interfering | intersection() { thread_neck(28, 1.2, 4, 2, 9); difference() { cylinder(d = 36, h = 11); translate([0, 0, -0.01]) cylinder(d = 28 - 2 * 1.2, h = 11.02); thread_bore_cut(28, 1.2, 4, 2, 9, 0, over = 0.4); } }
