# Positive tests for print-in-place.scad: pairs that must ASSEMBLE, and two
# that must not. Run by scripts/mate-check.sh (via check.sh); the format and
# the reason this file exists are documented there.
#
# Each statement builds the interference solid — the door-side part
# intersected with the rail-side part it slides under (or the hinge pin with
# its knuckle). A pair that fits leaves that intersection empty.
#
# The door offsets are the battleship's own derivation, written out so the
# arithmetic is visible: the door centre sits (body_w/2 - fit + tab_w + clr_h)
# from the rail wall's cell-side face — that is where the horizontal
# clearance clr_h comes from, and the lip_z derivation (clr_v enters
# POSITIVE, clr_h NEGATIVE) is what leaves clr_v of air above the tab. These
# cases measure both clearances by geometry instead of restating the algebra.
#
# <case name> | empty|interfering | <statement producing the interference>

# The battleship's own numbers: closed door (tabs y-aligned under the lips —
# the locked position), 0.5 horizontal / 0.4 vertical measured clearance.
tab-lip-fit | empty | intersection() { slide_rail(travel = 6.7, side = 1); translate([-(47.6/2 - 0 + 3.5 + 0.5), 0, 0]) slide_tab(body_w = 47.6); }

# A different parameter set entirely — narrower door, tighter clearances,
# thinner tabs, non-zero fit — so the fit is not proven only at the one size
# the library was extracted from (the threads-fdm fine-fit pattern).
tab-lip-tuned | empty | intersection() { slide_rail(travel = 8, clr_v = 0.3, clr_h = 0.4, tab_t = 1.0, fit = 0.2); translate([-(40/2 - 0.2 + 3.5 + 0.4), 0, 0]) slide_tab(body_w = 40, tab_t = 1.0, fit = 0.2); }

# THE NEGATIVE CONTROL, and the lock the lips exist to provide: the closed
# door lifted 1.5 mm rams its tabs into the lip undersides — chunky wedge
# overlap, not a coincident-face artifact (a zero-clearance pair would only
# kiss, and kissing faces measure as zero facets). If this reports 0 facets
# the harness has stopped measuring anything.
tab-lip-locks | interfering | intersection() { slide_rail(travel = 6.7, side = 1); translate([-(47.6/2 - 0 + 3.5 + 0.5), 0, 1.5]) slide_tab(body_w = 47.6); }

# The hinge pair at its defaults: the bore is the pin's profile grown by
# offset(r = 0.5), so the clearance is 0.5 mm on every surface — including
# the 45-degree flanks, which the obvious scaled-teardrop bore leaves
# COINCIDENT (the flank planes pass through the profile origin, so scaling
# never moves them; CGAL renders that kiss as a clean mate, and only CI's
# Manifold pass exposed it as an 8-facet sliver).
hinge-pin-fit | empty | intersection() { pip_hinge(pin_d = 4, clear = 0.5); pip_hinge_pin(pin_d = 4); }

# The flank-clearance case the coincident-plane bug needed: the pin lifted
# 0.3 mm toward the roof still fits (0.5 uniform clearance leaves ~0.21 mm
# at the flanks, 0.2 at the apex). Under the scaled-teardrop bore ANY +z
# lift crossed the coincident flank planes, so this case fails that
# construction under CGAL — the measured pin the sliver-only Manifold
# signal lacked.
hinge-pin-play | empty | intersection() { pip_hinge(pin_d = 4, clear = 0.5); translate([0, 0, 0.3]) pip_hinge_pin(pin_d = 4); }

# Second negative control: a pin oversized past the bore circle (radius 2.6
# vs 2.5) binds — genuinely negative clearance, -0.1 mm per side.
hinge-pin-binds | interfering | intersection() { pip_hinge(pin_d = 4, clear = 0.5); pip_hinge_pin(pin_d = 5.2); }
