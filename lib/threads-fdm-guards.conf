# Negative tests for threads-fdm.scad's guards — each line is a parameter set
# the library must REFUSE. Run by scripts/guard-check.sh (via check.sh); format
# and the reason this file exists are documented there.
#
#   <case name> | <expected message substring> | <statement>

# A negative chamfer clears the `length > ch` bound and then inverts the
# lead-in, building a neck TALLER than the length it documents: measured
# z extent 11.0 mm against a documented 9. Silent — exit 0, no warning.
neg-chamfer | chamfer must not be negative | thread_neck(28, 1.2, 4, 2, 9, chamfer = -2);

# Adjacent starts sit `pitch` apart, not `lead` apart, so `w_root < lead`
# passes here (2.9 < 4) while the ribs interpenetrate and fuse: printcheck
# reports ONE body against two at the capsule's own numbers.
multi-start-rib-collision | ribs do not clear each other | thread_helix(28, 1.2, 2, 2, 9);
