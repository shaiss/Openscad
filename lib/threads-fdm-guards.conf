# Negative tests for threads-fdm.scad's guards — each line is a parameter set
# the library must REFUSE. Run by scripts/guard-check.sh (via check.sh); format
# and the reason this file exists are documented there.
#
#   <case name> | <expected message substring> | <statement>

# A negative chamfer clears the `length > ch` bound and then inverts the
# lead-in, building a neck TALLER than the length it documents: measured
# z extent 11.0 mm against a documented 9. Silent — exit 0, no warning.
neg-chamfer | chamfer must not be negative | thread_neck(28, 1.2, 4, 2, 9, chamfer = -2);

# Adjacent starts sit `pitch` apart, not `lead` apart, so `w_root < lead`
# passes here (2.9 < 4) while the ribs interpenetrate and fuse: printcheck
# reports ONE body against two at the capsule's own numbers.
multi-start-rib-collision | ribs do not clear each other | thread_helix(28, 1.2, 2, 2, 9);

# The silent shrink of issue #58: `seg` samples the helix as a polygon, so a
# coarse value pulls the crest inside the circle it should trace. seg = 8 at
# d_major 28 loses 2.13 mm off the effective crest diameter and still exports
# a watertight, sliceable, gate-passing thread — it is simply the wrong size.
# Bounded as a chord tolerance (_max_chord), not a minimum segment count.
coarse-seg-chords | chords too coarsely | thread_helix(28, 1.2, 4, 2, 9, seg = 8);

# The same bound is radius-dependent, which is the half a fixed seg minimum
# would miss: seg = 40 is comfortable at d_major 28 (0.043 mm) and refused at
# 120 (0.185 mm). Without this case the guard could be rewritten as a constant
# floor and every check here would stay green.
coarse-seg-large-diameter | chords too coarsely | thread_helix(120, 1.2, 6, 1, 9, seg = 40);

# THE BOUNDARY, refusing half. The message does not only refuse — it advises,
# via ceil(180 / acos(1 - 2*_max_chord / d_major)), and at d_major 28 it says
# "Raise seg to at least 27". That advice is a second derivation, and nothing
# above holds it to the bound it claims to invert: seg = 8 and seg = 40 are
# both far from the edge, so a ceil/acos that drifted by one would keep every
# case here green while telling users a number that does not work.
#
# So the edge is pinned from both sides. This line is the refusing half; the
# accepting half (seg = 27 must RENDER) is case 6 in lib/threads-fdm-demo.scad,
# because a guard manifest can only express refusals. Neither half means much
# alone — together they say the advice is exact, not approximately right.
# The expected substring is the ADVICE, not the complaint, and that is the
# point: matching "Raise seg to at least 27" ties the ceil/acos derivation to
# the same edge the assert fires on. Refusing 26 while advising 28 would now
# fail here, where matching "chords too coarsely" would have accepted it.
boundary-seg-26-refused | Raise seg to at least 27 | thread_helix(28, 1.2, 4, 2, 9, seg = 26);
