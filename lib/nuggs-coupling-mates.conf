# Positive tests for nuggs-coupling.scad: pairs that must ASSEMBLE, plus the
# controls that prove the measurement can fail. Run by scripts/mate-check.sh
# (via check.sh); the format and the reason this file exists are documented
# there.
#
# THIS FILE IS THE POINT OF THE EXTRACTION. Before it, designs/nuggs proved its
# joint with designs/nuggs/nuggs-matetest.scad — a hand-run harness that was not
# in ci.parts and could not be, because ci.parts gates PARTS and nothing gated a
# FIT. A change could silently un-fix the coupling with every check in the repo
# green, and NOTES.md's last open item said exactly that.
#
# Each statement builds an INTERFERENCE SOLID: the intersection of one port face
# with the mate it goes into, at a stated relative clocking. If the two fit,
# that intersection is empty and OpenSCAD writes no facets at all.
#
#   <case name> | empty|interfering | <statement producing the interference>
#
# HOW A JOINT IS EXPRESSED HERE. The mate is the SAME part, `mirror([0,0,1])`ed
# so its sectors face ours, rotated by a clocking, and translated -pull in z.
# mirror preserves angle and flips z only, so the two tube end faces butt at
# z = 0 and the bore is continuous across the joint. The clockings are never
# written as numbers: nuggs_clockings(cfg) returns [pitch/2, pitch/2 - twist,
# pitch/2 + twist] = [insertion, locked-, locked+], and hardcoded copies of
# those went stale three rounds running in the design this came from.
#
# WHY EVERY SEATED CASE USES pull = 0.01 AND NOT 0. The seat and the tube face
# are BOTH zero-clearance stops by construction (z_seat = port_proj = -z_tip),
# so at pull = 0 the two solids share whole faces. Whether a kernel answers a
# shared-face intersection with nothing or with a zero-volume shell is a
# property of the kernel, not of the fit, and CI renders this suite twice — once
# on CGAL, once on the manifold backend. Measured on CGAL here, pull = 0 does
# come out empty; 0.01 mm (a fortieth of a layer, a thirtieth of port_tol) is a
# kernel-robustness margin, not a fit margin, and nothing below depends on it
# being larger.
#
# WHY NO $fn FUDGE IS NEEDED, which is worth stating because the obvious version
# of this file needs one. mate-check.sh renders at a hardcoded $fn = 96. Every
# surface of this coupling comes from rotate_extrude, so before the library
# pinned its own tessellation the realised clearance at the shell split moved
# with the caller's $fn, and the insertion clocking measured 11.51 mm3 of
# interference at $fn = 48, 13.06 at 56, 0.548 at 64, 0.0003 at 96, 0 at 120 and
# 0.0126 at 128 — non-monotone, and 96 is squarely inside it. A naive `empty`
# case here would have failed on a rounding artifact and taught the next person
# to add a tolerance. nuggs-coupling.scad pins $fa/$fs inside its own module
# bodies instead, so these cases measure the joint rather than the harness: the
# statements below are byte-identical in result at caller $fn of 16, 48, 96 and
# 128 (verified — same facet count, same volume to 9 decimals).

# ---------------------------------------------------------------------------
# The joint goes together
# ---------------------------------------------------------------------------

# Round to round at the insertion clocking: two identical faces, half a pitch
# apart, must be free to come together and come apart. This is the case the
# whole genderless claim rests on — where one part presents outer shell, the
# mate presents inner shell, at a different radius.
round-to-round-insert | empty | intersection() { nuggs_neck(nuggs_cfg(), 30); translate([0, 0, -0.01]) rotate([0, 0, nuggs_clockings(nuggs_cfg())[0]]) mirror([0, 0, 1]) nuggs_neck(nuggs_cfg(), 30); }

# ...and must be able to REACH the locked position once seated, not merely the
# insertion path. A rib that cannot travel to the end of its circumferential run
# gives a joint that will not lock, and the insertion case above cannot see it.
round-to-round-locked | empty | intersection() { nuggs_neck(nuggs_cfg(), 30); translate([0, 0, -0.01]) rotate([0, 0, nuggs_clockings(nuggs_cfg())[1]]) mirror([0, 0, 1]) nuggs_neck(nuggs_cfg(), 30); }

# A SECOND BORE. This is what makes the coupling a standard rather than one
# part: every radius, and the flank angle with them, is derived from bore_d, so
# a 100 mm module must mate a 100 mm module on the same derivation with no
# retuning. It is also the case that would have caught the pre-#56 bug, where
# the circumferential clearance scaled with bore_d and a coupon tuned at one
# bore mis-tuned another.
second-bore-insert | empty | intersection() { nuggs_neck(nuggs_cfg(bore_d = 100), 30); translate([0, 0, -0.01]) rotate([0, 0, nuggs_clockings(nuggs_cfg(bore_d = 100))[0]]) mirror([0, 0, 1]) nuggs_neck(nuggs_cfg(bore_d = 100), 30); }

# AN OPEN MODULE MATING A ROUND TUBE, which is the reason the port is a library
# and not a section of designs/nuggs. The open module is a tube with a 180 deg
# longitudinal window, so its floor IS the ri arc and is continuous with the
# round mate's bore to 0.000 mm at every lateral position. (A flat trough floor
# tangent to the invert would instead stand 6.93 mm proud of the round mate at
# the paw-span edge — a full-height toe-stub across the joint plane.) The window
# starts at z_top = 13, so the port face is backed by full-round shell and its
# inner sectors fuse to a ring rather than to a window edge.
open-module-to-round-insert | empty | intersection() { difference() { nuggs_neck(nuggs_cfg(), 40); nuggs_window(nuggs_cfg(), 13, 41, 180); } translate([0, 0, -0.01]) rotate([0, 0, nuggs_clockings(nuggs_cfg())[0]]) mirror([0, 0, 1]) nuggs_neck(nuggs_cfg(), 30); }

# ---------------------------------------------------------------------------
# The joint holds — and these are `interfering` on purpose
# ---------------------------------------------------------------------------

# RETENTION, round to round. Pulled 2 mm at the locked- clocking the two parts
# CANNOT occupy that position: three ribs are trapped under the mate's inner
# sectors, 47.758 mm3 across three bodies. That number is 28.117 mm2 of bearing
# area times the 1.699 mm of axial overlap left after a 2 mm pull, and 28.117 is
# what nuggs_bearing_area() reports. Note what it does not say: only ONE of the
# two rib sets bears per twist direction, so retention is symmetric but never
# simultaneous.
round-to-round-retains | interfering | intersection() { nuggs_neck(nuggs_cfg(), 30); translate([0, 0, -2]) rotate([0, 0, nuggs_clockings(nuggs_cfg())[1]]) mirror([0, 0, 1]) nuggs_neck(nuggs_cfg(), 30); }

# RETENTION, open module to round tube — the same 47.758 mm3, because the port
# does not know what body carries it. Together with the insertion case above
# this is the cross-body claim in full: a window and a tube mate, and hold, on
# one standard.
open-module-to-round-retains | interfering | intersection() { difference() { nuggs_neck(nuggs_cfg(), 40); nuggs_window(nuggs_cfg(), 13, 41, 180); } translate([0, 0, -2]) rotate([0, 0, nuggs_clockings(nuggs_cfg())[1]]) mirror([0, 0, 1]) nuggs_neck(nuggs_cfg(), 30); }

# THE NEGATIVE CONTROL. Two faces clocked at 0 instead of half a pitch put outer
# shell against outer shell and inner against inner, at the same radii: they
# must collide, hugely. If this ever reports 0 facets the harness has stopped
# measuring anything and every `empty` case above is worthless. Measured 9346.5
# mm3 — the pair is not marginally interfering, it is grossly so, which is what
# a control should be.
mis-clocked-collides | interfering | intersection() { nuggs_neck(nuggs_cfg(), 30); translate([0, 0, -0.01]) rotate([0, 0, 0]) mirror([0, 0, 1]) nuggs_neck(nuggs_cfg(), 30); }

# ---------------------------------------------------------------------------
# The bore-cut footgun, held down rather than commented
# ---------------------------------------------------------------------------

# nuggs_port() is NOT bore-clean: the backing collar and the inner sectors'
# anchoring half both reach inboard to ri - anchor_bite, because that is how
# they fuse to the tube. nuggs_neck() subtracts nuggs_bore_cut() for you, and
# this case is what says so — a probe cylinder filling the bore finds nothing.
#
# The probe is inset 0.5 mm from ri, and that number is deliberate, not a fudge:
# both cylinders are polygons, so a probe at exactly ri would poke through the
# bore cut's own chord sagitta (0.0137 mm at ri = 40, and the probe is drawn at
# the harness's $fn = 96 while the cut is drawn at the library's pinned $fa) and
# measure tessellation instead of material. 0.5 mm is 36x that sagitta, and the
# material this is looking for is 2 mm deep.
bore-clean-neck | empty | intersection() { nuggs_neck(nuggs_cfg(), 30); cylinder(r = nuggs_ri(nuggs_cfg()) - 0.5, h = 60, center = true); }

# THE FOOTGUN ITSELF, as the control for the case above. The same probe against
# a raw nuggs_port() with no bore cut finds 2304.7 mm3 of plastic standing in
# the bore. That part is watertight, one body, sliceable and scores 100/100 —
# this is the only check in the repo that can tell you the bore is blocked.
bore-footgun-raw-port | interfering | intersection() { nuggs_port(nuggs_cfg()); cylinder(r = nuggs_ri(nuggs_cfg()) - 0.5, h = 60, center = true); }

# ---------------------------------------------------------------------------
# The window really opens the module
# ---------------------------------------------------------------------------

# Without this pair, open-module-to-round-insert above would be vacuous: a
# nuggs_window() that silently cut nothing would leave a closed tube, and a
# closed tube mates a round port perfectly. So the window is probed with a
# narrower, axially inset copy of itself (176 deg, z 14..39 — narrower on every
# side so it shares no face with anything). The open module must contain NONE of
# it...
window-really-open | empty | intersection() { difference() { nuggs_neck(nuggs_cfg(), 40); nuggs_window(nuggs_cfg(), 13, 41, 180); } nuggs_window(nuggs_cfg(), 14, 39, 176); }

# ...and the closed neck it was cut from must contain 7590 mm3 of it. That is
# the control: if nuggs_window() ever stops producing a solid in the tube wall,
# this reports 0 facets and fails, and the case above stops being vacuous the
# moment this one does.
window-probe-is-in-the-wall | interfering | intersection() { nuggs_neck(nuggs_cfg(), 40); nuggs_window(nuggs_cfg(), 14, 39, 176); }
