# Negative tests for print-in-place.scad's guards — each line is a parameter
# set the library must REFUSE. Run by scripts/guard-check.sh (via check.sh);
# format and the reason this file exists are documented there.
#
# The guards are the battleship's own asserts, migrated with the modules they
# protect (plus the end-stop weld guard the extraction surfaced — the design
# had learned that rule in PR #3 hardening but never encoded it). Every case
# below is arithmetic-checked so the FIRST failing assert is the one named.
#
#   <case name> | <expected message substring> | <statement>

# travel 6 leaves 0.5 mm to clear a 5.5 mm tab — the door can never lift out.
travel-too-short | slide travel too short to free the tabs | slide_rail(travel = 6);

# clr_h 1.3 eats the lip down to 1.9 mm of overhang: under the 2 mm the
# closed-door lock needs (travel 12.7 keeps the earlier guard passing).
lip-engagement | not enough lip engagement | slide_rail(travel = 12.7, clr_h = 1.3);

# travel 10 needs 16 mm between adjacent lips; the default centres are
# 15.25 apart, so a sliding tab would ram the next lip before full travel.
tab-hits-lip | tabs would hit the lips at full slide | slide_rail(travel = 10);

# A door loosened by fit 1.3 leaves 1.4 mm of tab under the lip — below the
# 1.5 mm engagement floor the pair's cross-check enforces.
fit-too-loose | door_fit too loose | slide_rail(travel = 6.7, fit = 1.3);

# lip_top_drop must stay strictly inside (0, rail_ext): at 0.8 = rail_ext the
# filler web vanishes and the lip top lands back on the rail-top plane — the
# Manifold non-manifold seam the drop exists to avoid (288 bad edges).
lip-top-drop | lip_top_drop must be greater than 0 | slide_rail(travel = 6.7, lip_top_drop = 0.8);

# The door-side half of the fit range: past +0.5 the tabs barely reach the
# lips no matter what the rail says.
fit-range | door_fit outside the safe range | slide_tab(body_w = 47.6, fit = 0.6);

# A negative membrane would sink the window cut below the bed — silently a
# thicker floor, not a thinner membrane.
membrane-negative | membrane thickness must not be negative | sacrificial_membrane(h = -0.1) square(10, center = true);

# A zero-height cutter cuts nothing: the caller gets an uncut plate where the
# documented opening should be.
membrane-no-cut | cut height must be positive | sacrificial_membrane(h = 0.2, cut_h = 0) square(10, center = true);

# 0.2 mm was the battleship's original construction gap, and it welded: a
# closed door's draped first layer reaches anything nearer than one 0.4 mm
# extrusion width.
endstop-weld-gap | spot-welds to a nearer ridge | end_stop(door_w = 47.6, gap = 0.2);

# 0.1 mm of hinge clearance is inside first-layer squish at typical layer
# heights — the pin prints welded to the knuckle.
hinge-weld | hinge clearance under 0.25 | pip_hinge(clear = 0.1);

# A 0.8 mm knuckle wall is under 3 perimeters at a 0.4 mm nozzle (CLAUDE.md's
# wall floor) at the knuckle's thinnest point.
hinge-wall | knuckle wall under 1.2 | pip_hinge(wall = 0.8);
