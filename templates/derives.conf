# Lineage of a derivative design — copy to designs/<name>/derives.conf and
# fill in.  Validate with ./scripts/lineage.sh check; the format and the
# tooling live in tools/lineage.
#
# A derivative reuses another design's geometry and replaces part of it.
# The entry .scad does `include <../<parent>/<parent>.scad>` and then
# redefines the modules or variables it wants different; the parent's own
# call sites route to the redefinition, so a `top()` call inside the
# parent's assembly picks up YOUR top(), not its own.  That is the whole
# mechanism and it works.  What it does not do is tell you anything, and
# these four silences are why this file has to exist:
#
#  1. Getting the override wrong looks exactly like getting it right.
#     Redefine `Lid` when the parent's module is `lid` and you get exit 0,
#     no WARNING, no ERROR, a watertight STL and 100/100 from printcheck —
#     of the base part you were trying to replace.  Nothing downstream
#     distinguishes that from success.
#  2. Which is what `replaces:` is for.  A missed override renders the
#     parent's mesh exactly, where a real override renders a different one.
#     Each `replaces:` entry is a claim the render gate settles by that
#     comparison, which turns silence back into a failure.  (The gate
#     compares canonicalised meshes, not file bytes: OpenSCAD re-orders
#     facets between renders of unchanged source, so a byte hash would
#     call every pair different and pass everything.  See
#     docs/derivative-designs.md.)
#  3. With more than one parent, the LAST include wins on any module both
#     define — silently.  Swapping two include lines took a test mesh from
#     12 facets to 72 with zero diagnostics.  Include order is therefore
#     load-bearing, and the parent order below has to match the .scad's
#     include order: left to right within a line, top to bottom across
#     lines.
#  4. `include` is not guarded, so a diamond — two parents sharing an
#     ancestor — evaluates that ancestor TWICE (echo-counted: 1x through
#     one parent, 2x through a diamond).  The duplicate geometry unions
#     cleanly into one watertight body scoring 100/100, so no check
#     downstream can see it.  Only an ancestor that emits no top-level
#     geometry survives that, which is what `diamond-ok:` asserts and the
#     gate proves.
#
# Syntax follows the other per-design conf files: `key: value`, `#` starts
# a comment, blank lines ignored, values comma-separated.  Unrecognised
# keys are an error — including `reuses:` from an early draft of this
# format, now retired: every part of a derivative is gated, so there is no
# "inherited, skip it" list to write.
#
# Every key below is empty as shipped, so copying this file declares
# nothing until you type a name after a colon.  A design with no parent is
# not a derivative and wants no derives.conf at all.


# Parent design names, in INCLUDE ORDER (warning 3).  Both keys are the
# OKH metadata terms and the tooling treats them identically; pick the one
# that describes the relationship and use either, or both.  The combined
# ordered parent list is every parent-bearing line in file order, so two
# keys read top to bottom as written here.
#
#   variant-of:    sushi-battleship
#   derivative-of: desiccant-capsule, nuggs
variant-of:
derivative-of:

# The parent parts this derivative claims to change, as `<parent>:<part>`
# where <part> is one of that parent's ci.parts values.  An empty part
# ("<parent>:") means the parent's default render, the one with no
# -D part=.  List every part you meant to change: an unlisted change is
# ungated, and a listed non-change is the typo in warning 1 — which is the
# whole reason to write these down rather than trust the render.
#
#   replaces:      sushi-battleship:top, sushi-battleship:door
replaces:

# Ancestors reached twice through a diamond, asserted safe to reach twice
# (warning 4).  This is a signature, not a suppression — the render gate
# holds the named ancestor to the base-safety claim rather than taking it.
# Most designs fail it: a top-level `main();` is enough to disqualify one,
# and the fix is to move that geometry behind a module in the ancestor,
# not to add a line here.
#
#   diamond-ok:    desiccant-capsule
diamond-ok:
