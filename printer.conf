// printer.conf — your printer's measured profile.
//
// INERT BY DEFAULT. As committed this file overrides nothing, so every design
// that opts in falls back to the generic defaults in lib/printer-conf.scad.
// That is the "off" state: a fresh clone behaves exactly as it did before this
// file existed.
//
// To use it, uncomment the values you have actually measured — from a coupon
// sweep (`./scripts/render.sh <name> --sweep <param>=<lo>:<hi>:<step>`) or a
// real print — and leave the rest to the defaults. A design that opts in reads
// these instead of hardcoding a generic clearance:
//
//     include <printer-conf.scad>          // generic defaults + this profile
//     fit = printer_fit(nominal_width);    // grown by your measured clearance
//
// The "Log a print result" GitHub Action (.github/workflows/log-print-result.yml)
// can also append measured deviations to a design's NOTES.md for you.
//
// This is the repo-level profile; keep personal values out of version control
// by leaving your local edits uncommitted. All dimensions in millimeters.

// printer_xy_tol   = 0.20;   // horizontal fit clearance you actually get
// printer_nozzle_d = 0.40;   // nozzle diameter
// printer_material = "PLA";  // default material
