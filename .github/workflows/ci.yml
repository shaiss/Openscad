name: CI

# push covers direct pushes to the default branch; pull_request covers PR
# branches — scoping push this way avoids double-running every PR commit.
#
# The `changes` job decides what actually runs: docs/skills-only PRs skip
# the expensive render jobs, and design-only PRs gate just the designs they
# touch. Downstream jobs are skipped via `if:` on the changes outputs rather
# than workflow-level `paths:` filters, because a paths-filtered workflow
# reports nothing at all and leaves required checks pending forever, while an
# `if:`-skipped job at least reports a check run. Keep the job `name:` strings
# stable: they are what branch protection matches on.
#
# CAUTION, learned the hard way on PR #50: a check run reported as *skipped*
# does NOT satisfy a required status check here. That PR had all 13 checks
# reported and a mergeable_state of "clean", and the merge API still refused
# it with "5 of 5 required status checks are expected", because three of the
# five required contexts had been skipped. So any path that reaches merge
# must actually RUN the five required jobs — Detect changed paths, Lint
# scripts and workflows, OpenSCAD syntax/geometry check, printcheck unit
# tests, and Render designs, gate STLs, test-slice. Adding a top-level
# directory without adding it to the classifier below makes every PR that
# touches only that directory permanently unmergeable.
#
# That is also why the `regen` job is ungated and why the four jobs that
# `needs:` it carry `if: !cancelled()`: a skipped `regen` would skip them
# too, and two of them (Detect changed paths' downstream syntax check, and
# the gate) are required contexts. regen always runs and decides internally
# whether it has any work.
on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same PR are wasted minutes; cancel them. Default-
# branch pushes always run to completion so the branch's status is trustworthy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; the one exception is render-gate's job-level
# pull-requests:write, used only to upsert the sticky printcheck comment.
permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      scad: ${{ steps.filter.outputs.scad }}
      printcheck_tests: ${{ steps.filter.outputs.printcheck_tests }}
      stylelift_tests: ${{ steps.filter.outputs.stylelift_tests }}
      lineage_tests: ${{ steps.filter.outputs.lineage_tests }}
      styles: ${{ steps.filter.outputs.styles }}
      gate: ${{ steps.filter.outputs.gate }}
      gate_designs: ${{ steps.filter.outputs.gate_designs }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed files
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          scad=false; ptests=false; stests=false; ltests=false; styles=false
          gate=false; designs=""
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            # Default-branch push: run everything, gate every design.
            scad=true; ptests=true; stests=true; ltests=true; styles=true
            gate=true; designs=ALL
          else
            # Capture via command substitution so a git failure fails the
            # step: mapfile < <(git diff ...) would swallow the error and
            # fail open — every job skipped, PR green having tested nothing.
            changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
            files=()
            [ -n "$changed" ] && mapfile -t files <<<"$changed"
            echo "changed files:"; printf '  %s\n' "${files[@]}"
            infra=false
            declare -A names=()
            declare -A touched_styles=()
            for f in "${files[@]}"; do
              case "$f" in
                # A lib/script/printcheck/workflow change can break any
                # design, so it re-gates all of them. tools/lineage joins
                # that list because it is what decides which designs a
                # change reaches at all: edit the resolver and every blast
                # radius in the tree can move, including the one this very
                # step is about to compute — so the safe reading of a
                # resolver edit is "assume it reaches everything".
                lib/*|scripts/*|tools/printcheck/*|tools/lineage/*|\
                .github/workflows/ci.yml)
                  infra=true ;;
              esac
              case "$f" in
                # A style, the tool behind it, or anything a swatch includes
                # can change what the style gate concludes.
                styles/*|tools/stylelift/*|lib/*|scripts/style-*.sh|\
                designs/*/style.conf|.github/workflows/ci.yml)
                  styles=true ;;
              esac
              case "$f" in
                # A style's tokens are compiled into every design that
                # declares it, so editing style.json/style.scad moves that
                # design's geometry — the printcheck+slice gate has to see
                # it, not just the style gate. Remember which styles moved
                # and map them back to designs after the loop.
                styles/*) s=${f#styles/}; touched_styles[${s%%/*}]=1 ;;
              esac
              case "$f" in
                designs/*/*)
                  n=${f#designs/}; n=${n%%/*}
                  # skip names whose entry point no longer exists (deleted
                  # or renamed design directories)
                  [ -f "designs/$n/$n.scad" ] && names[$n]=1 ;;
              esac
              case "$f" in
                tools/printcheck/*|.github/workflows/ci.yml) ptests=true ;;
              esac
              case "$f" in
                tools/stylelift/*|.github/workflows/ci.yml) stests=true ;;
              esac
              case "$f" in
                tools/lineage/*|.github/workflows/ci.yml) ltests=true ;;
              esac
              case "$f" in
                # tools/lineage is here and tools/printcheck is not:
                # printcheck only ever reads exported STLs, after the fact,
                # while check.sh itself RUNS the lineage resolver
                # (`./scripts/lineage.sh check`) and fails on what it reports —
                # so editing the resolver can change what the syntax/eval job
                # concludes. Not because of the selftest fixtures: those live
                # under tools/ and check.sh's globs cover only designs/, lib/,
                # templates/ and styles/, so it never reads them.
                #
                # site/ and vercel.json are here for a different reason
                # entirely — see the required-context note below; they cannot
                # move geometry, but the job has to RUN for such a PR to be
                # mergeable at all.
                designs/*|lib/*|templates/*|scripts/*|styles/*|site/*|\
                vercel.json|tools/lineage/*|.github/workflows/ci.yml)
                  scad=true ;;
              esac
              # site/ and vercel.json cannot affect geometry — the site
              # renders content FROM the designs, it does not define any.
              # But three of the five contexts branch protection requires
              # are the geometry jobs, and a job skipped via `if:` does NOT
              # satisfy a required context here (verified: PR #50, all 13
              # checks reported, merge still refused with "5 of 5 required
              # status checks are expected"). Without this, a site-only PR
              # is permanently unmergeable. The cheaper fix is to require
              # "Static site builds" instead of the geometry jobs for these
              # paths, but that needs a branch-protection change.
              case "$f" in
                site/*|vercel.json)
                  infra=true; ptests=true ;;
              esac
            done
            # The other direction: a design that declares a style the PR
            # touched gets gated as if the design itself had changed.
            for conf in designs/*/style.conf; do
              [ -f "$conf" ] || continue
              n=${conf#designs/}; n=${n%%/*}
              [ -f "designs/$n/$n.scad" ] || continue
              s="$(grep -vE '^[[:space:]]*(#|$)' "$conf" | head -1 \
                   | tr -d '[:space:]' || true)"
              [ -n "${touched_styles[${s:-_none_}]:-}" ] && names[$n]=1
            done
            # Blast radius. A derivative design includes its parent's .scad
            # and redefines part of it, so a change under designs/<parent>/
            # moves the derivative's geometry without the diff naming one
            # file inside the derivative's own directory. Gating what git
            # reported would render the parent, pass it, and never export
            # the parts that inherited the change — and because a
            # redefinition that binds nothing is completely silent (the
            # failure scripts/gate.sh's derivative check exists to catch),
            # the derivative can go on shipping a wrong-but-watertight STL
            # behind a green check. Ask the resolver for the descendants.
            #
            # No install step, deliberately: tools/lineage is stdlib-only so
            # that the job deciding what to install can run it first.
            #
            # Unguarded, and it must stay that way. The resolver exits
            # non-zero on a cycle or an unparsable derives.conf; under
            # `set -euo pipefail` that fails the step, which is the point.
            # A `|| true` here would leave names at whatever the diff
            # happened to mention and report green having never gated the
            # parts that moved — the same fail-open trap the command
            # substitution above was written to avoid.
            #
            # Two skips, both narrow. $infra already means designs=ALL, so
            # there is nothing left to widen and nothing can go ungated by
            # not asking — judging whether the records themselves are sound
            # is `lineage check`'s job, not this step's. And an empty names
            # would expand to ZERO arguments, which the resolver rejects as
            # a usage error rather than reading as "no designs".
            #
            # Placed above the style sweep below so a derivative that
            # declares a style is re-checked against it too: its geometry
            # just moved, which is the same reason the sweep exists.
            if ! $infra && [ "${#names[@]}" -gt 0 ]; then
              radius="$(./scripts/lineage.sh blast-radius "${!names[@]}")"
              while IFS= read -r n; do
                # Same rule as the loop above: a lineage record can outlive
                # the design it names, and gating a design with no entry
                # point would fail the gate under the wrong design's name.
                [ -n "$n" ] && [ -f "designs/$n/$n.scad" ] && names[$n]=1
              done <<<"$radius"
            fi
            # A changed design that claims a style has to be re-checked
            # against it: the claim is about its geometry, and its geometry
            # is what just moved.
            for n in "${!names[@]}"; do
              [ -f "designs/$n/style.conf" ] && styles=true
            done
            if $infra; then
              gate=true; designs=ALL
              # An infra change gates every design THROUGH printcheck, so the
              # analyzer is on the critical path for the whole run and its own
              # tests belong in it — a printcheck regression would otherwise be
              # judged by the very build that shipped it.
              #
              # This also closes a merge trap. "printcheck unit tests" is one of
              # the five required contexts, and a job skipped via `if:` does NOT
              # satisfy one (PR #50, see the note at the top of this file). With
              # ptests set only by tools/printcheck/, site/ and this workflow, a
              # lib/- or scripts/-only PR — the most common kind here — reported
              # it as skipped and could never be merged. The site/* rule below
              # already carries ptests for exactly this reason; the same hole
              # was left open on the infra path until #37 fell into it.
              ptests=true
            elif [ "${#names[@]}" -gt 0 ]; then
              gate=true; designs="${!names[*]}"
            fi
          fi
          {
            echo "scad=$scad"
            echo "printcheck_tests=$ptests"
            echo "stylelift_tests=$stests"
            echo "lineage_tests=$ltests"
            echo "styles=$styles"
            echo "gate=$gate"
            echo "gate_designs=$designs"
          } >> "$GITHUB_OUTPUT"

  regen:
    # Everything in the tree that is DERIVED from a design rather than
    # authored: preview PNGs (previews/cameras.conf), animation GIFs
    # (animations.conf), studio product shots (shots.conf), the README
    # gallery, and — when a product page is missing or too thin to pass its
    # gate — an AI-drafted README.md.
    #
    # These used to be run by hand and committed. Every gate on them is
    # presence-only *because* a human committed them, which is exactly the
    # hole issue #69 describes: a geometry change staled three
    # desiccant-capsule previews and readme-gate passed them clean, still
    # showing a thread profile the design no longer had. Regenerating here
    # closes that at the root — the committed image cannot depict older
    # geometry than the source beside it, because one run produces both.
    #
    # Ungated on purpose. The job always RUNS (skipping only its own
    # expensive installs when the classifier says no design moved), because
    # four jobs `needs:` it and a job skipped via `if:` would skip those
    # too — and three of them are required contexts (see the CAUTION at the
    # top of this file).
    #
    # Cost note: an infra change sets gate_designs=ALL, so a lib/ or
    # scripts/ edit re-renders every design's shots, Cycles included. That
    # is deliberate — such a change can move any design's geometry, which is
    # precisely when a stale image is most misleading — and it runs in
    # parallel with render-gate, which is the longer pole either way.
    name: Regenerate previews and product pages
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      # The one job in this workflow that writes.
      contents: write
    env:
      # One definition, used to write the commit AND to recognise it on the
      # next run (see the loop guard in the commit step). Drift between the
      # two would silently disarm that guard.
      REGEN_SUBJECT: "CI: regenerate previews and product pages"
    outputs:
      # The commit this job pushed, or "" when it pushed nothing. Downstream
      # jobs pass it straight to actions/checkout's `ref`, where the empty
      # string means "the default ref for this event" — so an idle run keeps
      # the normal PR merge-ref checkout, and only a run that actually
      # committed redirects them onto the updated head.
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The branch itself, not the PR merge ref: a merge ref is not a
          # branch and cannot be pushed back to. persist-credentials stays
          # on (the default) because this job needs them for that push.
          ref: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.head.ref
                || github.ref_name }}
          repository: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.head.repo.full_name
                || github.repository }}
          # REGEN_TOKEN (a fine-grained PAT with contents:write) rather than
          # GITHUB_TOKEN, because of a rule with teeth: a push made with
          # GITHUB_TOKEN does not trigger any workflow. Check runs attach to
          # the commit the run started on, so committing back with it moves
          # the PR head to a commit carrying NONE of the required contexts,
          # and nothing will ever come along to add them — the PR is then
          # permanently unmergeable, the exact trap the CAUTION at the top of
          # this file describes. A PAT push does trigger a run, so the
          # required checks land on the commit that actually ships.
          #
          # Falls back to GITHUB_TOKEN when the secret is absent so a fork or
          # a not-yet-configured repo still regenerates; the commit step says
          # loudly what that costs.
          token: ${{ secrets.REGEN_TOKEN || github.token }}

      - name: Decide what needs regenerating
        id: plan
        env:
          GATE: ${{ needs.changes.outputs.gate }}
          GATE_DESIGNS: ${{ needs.changes.outputs.gate_designs }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HAVE_PAT: ${{ secrets.REGEN_TOKEN != '' }}
        run: |
          set -euo pipefail
          designs=""
          if [ "$GATE" = "true" ]; then
            if [ "$GATE_DESIGNS" = "ALL" ]; then
              for d in designs/*/; do
                n=${d#designs/}; n=${n%/}
                [ -f "designs/$n/$n.scad" ] && designs="$designs $n"
              done
            else
              designs="$GATE_DESIGNS"
            fi
          fi
          # Normalize to a single-space-separated list: gate_designs arrives
          # space-separated and the ALL branch above builds one with a leading
          # space, and the emptiness test below has to see "" for "nothing".
          # shellcheck disable=SC2086  # splitting the name list is the point
          set -- $designs
          designs="$*"
          # Which toolchains this run actually needs. bpy is a ~1 GB wheel and
          # Cycles is minutes per shot, so it is installed only when some
          # target design ships a shots.conf — not on every design change.
          shots=false
          for n in $designs; do
            [ -f "designs/$n/shots.conf" ] && shots=true
          done
          # OpenSCAD is needed for any regeneration at all: previews and GIFs
          # render through it, and gallery.sh renders a missing contact sheet.
          render=false
          [ -n "$designs" ] && render=true
          # A fork PR's GITHUB_TOKEN is read-only, so there is nothing to push
          # back to. The commit step turns that into a clear failure with the
          # file list rather than a permissions error nobody can act on.
          can_push=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] \
             && [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            can_push=false
          fi
          # LOOP GUARD. Pushing with a PAT re-triggers this workflow, so a
          # regeneration that is not byte-stable would push, re-trigger,
          # push again, forever. It is not a hypothetical: tools/photoshot
          # documents that Cycles selects an SSE4.2 or AVX2 kernel by what
          # the host CPU supports and that their rounding differs, and
          # nothing pins a run to one runner model.
          #
          # So allow at most ONE regen commit per chain: if HEAD is already
          # one of ours, this is the verification pass. It still regenerates
          # and the gates still judge the result — it just refuses to push
          # again, which bounds the cycle at two runs no matter how unstable
          # the renderer is.
          already=false
          if [ "$(git log -1 --format=%s)" = "$REGEN_SUBJECT" ] \
             && [ "$(git log -1 --format=%ae)" = "41898282+github-actions[bot]@users.noreply.github.com" ]; then
            already=true
            echo "::notice::HEAD is already a regen commit — this pass verifies it and will not push again"
          fi
          {
            echo "designs=$designs"
            echo "shots=$shots"
            echo "render=$render"
            echo "can_push=$can_push"
            echo "already=$already"
            echo "have_pat=$HAVE_PAT"
          } >> "$GITHUB_OUTPUT"
          echo "regenerating: ${designs:-(nothing — no design moved)}"

      - name: Install the render toolchain (OpenSCAD nightly, xvfb, ImageMagick)
        if: steps.plan.outputs.render == 'true'
        # openscad-nightly is the same engine render-gate uses, so a preview is
        # rendered by the build that gates the STL sitting next to it.
        #
        # Deliberately plain apt-get rather than awalsh128/cache-apt-pkgs-action,
        # which the other jobs use: ImageMagick's `convert` and `montage` are
        # update-alternatives symlinks (/usr/bin/montage -> /etc/alternatives/
        # montage -> /usr/bin/montage-im6.q16), and that symlink farm is built
        # by the package's postinst, not shipped in its file list. A cache
        # restore replays the files without the postinst, so `montage` comes
        # back dangling and render.sh dies on "montage: command not found".
        # It fails exactly one run late — the cold run saves the cache and
        # passes, the next one restores it and breaks — which is worth the ~20s
        # this costs. The jobs that do cache apt only need xvfb and openscad,
        # neither of which uses alternatives. (lifestyle-shot.yml already
        # installs ImageMagick this way, for what is presumably this reason.)
        #
        # gifsicle is optional to animate.sh (palette shrink) but keeps GIFs
        # inside the size budget readme-gate enforces.
        run: |
          echo 'deb https://download.opensuse.org/repositories/home:/t-paul/xUbuntu_24.04/ /' \
            | sudo tee /etc/apt/sources.list.d/openscad-nightly.list
          curl -fsSL 'https://download.opensuse.org/repositories/home:/t-paul/xUbuntu_24.04/Release.key' \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/openscad-nightly.gpg
          sudo apt-get update
          sudo apt-get install -y openscad-nightly xvfb imagemagick gifsicle
          openscad-nightly --version
          # Prove the alternatives-backed binaries actually resolve, so a
          # packaging regression fails here with a clear message instead of
          # halfway through a design's previews.
          montage --version | head -1
          convert --version | head -1

      - name: Set up Python 3.11 (the interpreter bpy ships wheels for)
        if: steps.plan.outputs.shots == 'true'
        uses: actions/setup-python@v6
        with:
          # 3.11 exactly: bpy 4.5 publishes wheels for 3.11 only, which is the
          # same constraint .claude/hooks/session-start.sh documents. The
          # runner's default 3.12 finds no wheel and the install fails.
          python-version: '3.11'
          cache: pip

      - name: Install bpy
        if: steps.plan.outputs.shots == 'true'
        run: |
          python3 -m pip install -q 'bpy~=4.5.0'
          python3 -c 'import bpy; print("bpy", bpy.app.version_string)'

      - name: Regenerate previews, animations, product shots and the gallery
        if: steps.plan.outputs.render == 'true'
        env:
          OPENSCAD_BIN: openscad-nightly
          OPENSCAD_ARGS: --backend=manifold
          DESIGNS: ${{ steps.plan.outputs.designs }}
          SHOTS: ${{ steps.plan.outputs.shots }}
        run: |
          set -euo pipefail
          for n in $DESIGNS; do
            # Each generator errors out when its manifest is absent, so ask
            # first — a design with no frozen cameras is not a failure.
            [ -f "designs/$n/previews/cameras.conf" ] && ./scripts/render.sh "$n" --previews
            [ -f "designs/$n/animations.conf" ]       && ./scripts/animate.sh "$n"
            if [ "$SHOTS" = "true" ] && [ -f "designs/$n/shots.conf" ]; then
              ./scripts/product-shot.sh "$n"
            fi
          done
          # Last, and unconditional within this step: the gallery is ordered by
          # the lineage resolver and scrapes each design's NOTES.md and contact
          # sheet, so it has to be rebuilt after the sheets above are current.
          ./scripts/gallery.sh

      - name: Draft product pages that do not pass their gate (Claude API)
        if: steps.plan.outputs.designs != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DESIGNS: ${{ steps.plan.outputs.designs }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set — skipping product-page drafting"
            exit 0
          fi
          for n in $DESIGNS; do
            # product-page.sh no-ops when the page already passes, and restores
            # the previous README when a draft fails the gate. A failure here
            # is deliberately not fatal: "Design product pages" is the job that
            # judges the page and will report the real problem first-hand,
            # rather than this job reporting it second-hand and masking it.
            ./scripts/product-page.sh "$n" \
              || echo "::warning::could not draft a product page for ${n} — see the 'Design product pages' job"
          done

      - name: Commit and push what changed
        id: commit
        env:
          CAN_PUSH: ${{ steps.plan.outputs.can_push }}
          ALREADY: ${{ steps.plan.outputs.already }}
          HAVE_PAT: ${{ steps.plan.outputs.have_pat }}
          BRANCH: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.head.ref
                || github.ref_name }}
        run: |
          set -euo pipefail
          # Precise adds: only the two places a generator writes. `git add -A`
          # over the whole tree would sweep in anything else a step left behind.
          git add -A designs README.md
          if git diff --cached --quiet; then
            echo "nothing regenerated — the committed artifacts already match their sources"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "regenerated:"
          git diff --cached --name-only | sed 's/^/  /'
          if [ "$ALREADY" = "true" ]; then
            # Second pass, and the output STILL differs from what the first
            # pass committed. The sources didn't move, so this is the
            # renderer disagreeing with itself across runners — real, but not
            # something to fix by pushing again. Report it and stop: the
            # committed artifacts are the first pass's, which the gates in
            # this very run have judged.
            echo "::warning::Regenerating produced a different result than the regen commit already on this branch, with no source change in between. That means a generator is not reproducible across runners — the files above differ only by rendering noise. Committed artifacts are left as they are; the loop guard stops here rather than pushing again."
            echo "sha=" >> "$GITHUB_OUTPUT"
            git reset >/dev/null
            exit 0
          fi
          if [ "$CAN_PUSH" != "true" ]; then
            echo "::error::Committed artifacts are stale and CI cannot push to a fork. Regenerate the files listed above locally (./scripts/render.sh <name> --previews, ./scripts/animate.sh, ./scripts/product-shot.sh, ./scripts/gallery.sh) and commit them, or re-open this PR from a branch in this repository."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$REGEN_SUBJECT"
          git push origin "HEAD:${BRANCH}"
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$HAVE_PAT" != "true" ]; then
            # Without a PAT this push cannot trigger a run, so the required
            # contexts stay on the commit we just replaced and the PR becomes
            # unmergeable with no failing check to explain why. Say so where
            # someone will see it, rather than leaving them to work it out.
            echo "::error::Regenerated artifacts were committed as ${sha}, but the REGEN_TOKEN secret is not set, so this push used GITHUB_TOKEN and will NOT trigger a run. The required status checks are still attached to the previous commit and this PR cannot merge until something re-runs CI on ${sha} (push any commit, or re-run this workflow). Fix permanently by adding REGEN_TOKEN — a fine-grained PAT with contents:write on this repository."
          fi
          {
            echo "### Regenerated artifacts"
            echo
            echo "Committed as \`${sha}\` on \`${BRANCH}\`:"
            echo
            git show --pretty=format: --name-only HEAD | while IFS= read -r f; do
              [ -n "$f" ] && printf -- "- \`%s\`\n" "$f"
            done
            echo
            echo "A product page drafted by \`scripts/product-page.sh\` carries an"
            echo "\`AI-drafted\` marker comment — read it before merging and delete the marker."
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint scripts and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: shellcheck
        # warning+: style-level nits (SC2001 etc.) don't fail the build
        run: shellcheck --severity=warning scripts/*.sh .claude/hooks/*.sh
      - name: Python syntax check
        # tools/photoshot/* matches no case in the `changes` classifier, so a
        # PR touching only photoshot.py would otherwise run no verification
        # at all. This job is ungated, so a syntax check here covers every
        # first-party .py (photoshot, gate-summary, printcheck) on every PR
        # without re-gating designs a renderer change cannot affect.
        # ast.parse rather than py_compile: py_compile writes __pycache__ next
        # to each source, which is gitignored but still litters the tree (and
        # trips docs-check's scripts/ glob locally). This only parses.
        run: |
          set -euo pipefail
          mapfile -t pyfiles < <(git ls-files '*.py' | grep -v '^lib/BOSL2/')
          printf 'checking %s\n' "${pyfiles[@]}"
          # feature_version pins the grammar to the oldest interpreter the repo
          # supports (tools/printcheck/pyproject.toml: requires-python >=3.10),
          # so syntax that only a newer runner default would accept still
          # fails here rather than at a 3.10 user's install.
          python3 -c '
          import ast, sys
          for f in sys.argv[1:]:
              with open(f, encoding="utf-8") as fh:
                  ast.parse(fh.read(), filename=f, feature_version=(3, 10))
          print(f"{len(sys.argv)-1} file(s) parsed clean against Python 3.10 syntax")
          ' "${pyfiles[@]}"
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: sca2d (report-only)
        # Static analysis of first-party .scad files. lint-scad.sh always
        # exits 0 while we build confidence in the signal — the step exists
        # to surface findings in the log, not to gate (yet).
        run: |
          pip install sca2d
          ./scripts/lint-scad.sh

  printcheck-tests:
    name: printcheck unit tests
    needs: changes
    if: needs.changes.outputs.printcheck_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install printcheck
        run: pip install -e 'tools/printcheck[test]'
      - name: Run tests
        run: python -m pytest tools/printcheck/tests -q

  stylelift-tests:
    name: stylelift unit tests
    needs: changes
    if: needs.changes.outputs.stylelift_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install stylelift
        run: pip install -e 'tools/stylelift[test]'
      - name: Run tests
        run: python -m pytest tools/stylelift/tests -q

  lineage-tests:
    name: lineage unit tests
    needs: changes
    if: needs.changes.outputs.lineage_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install lineage
        # The [test] extra pulls pytest and nothing else — the package's
        # runtime dependencies are empty on purpose, since the classifier
        # job above calls the resolver before anything is installed.
        run: pip install -e 'tools/lineage[test]'
      - name: Run tests
        run: python -m pytest tools/lineage/tests -q

  style-gate:
    # Every style pack must stay internally consistent (style.scad and
    # STYLE.md generated from style.json) and its swatch must still satisfy
    # its own rules — plus any design that declares a style in style.conf.
    name: Style packs and conformance
    needs: changes
    if: needs.changes.outputs.styles == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install xvfb (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          # No ImageMagick: style-check.sh refreshes the swatch preview only
          # when montage is present, and this job is here to judge conformance.
          packages: xvfb
          # cache key; bump to pull fresh package versions (see scad-check)
          version: "2026-08"
      - name: Install OpenSCAD nightly (OBS repo)
        # Same engine as render-gate, so a swatch measures the same here as
        # it does in the gate that judges the printable parts.
        run: |
          echo 'deb https://download.opensuse.org/repositories/home:/t-paul/xUbuntu_24.04/ /' \
            | sudo tee /etc/apt/sources.list.d/openscad-nightly.list
          curl -fsSL 'https://download.opensuse.org/repositories/home:/t-paul/xUbuntu_24.04/Release.key' \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/openscad-nightly.gpg
          sudo apt-get update
          sudo apt-get install -y openscad-nightly
          openscad-nightly --version
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install stylelift
        run: pip install -e tools/stylelift
      - name: Check style packs and declared designs
        env:
          OPENSCAD_BIN: openscad-nightly
          OPENSCAD_ARGS: --backend=manifold
        run: ./scripts/style-check.sh

  design-docs:
    # Deliberately not gated behind `changes`: it needs no installs, runs in
    # seconds, and always reporting keeps it usable as a required check.
    #
    # It does wait on `regen`, because regen is what makes the artifacts this
    # job checks current — judging the pre-regen tree would fail on exactly
    # the staleness regen just fixed. `!cancelled()` keeps it reporting even
    # when regen fails, so a regen problem shows up as a red regen rather
    # than as a check that never reports.
    name: Design product pages
    needs: regen
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ needs.regen.outputs.sha }}
      - name: Every design ships a product-page README
        run: ./scripts/readme-gate.sh
      - name: Lifestyle-shot disclosure guards still fire
        # No lifestyle-*.png exists in the tree yet, so the per-design gate
        # above never exercises requirement 9. The selftest builds throwaway
        # fixtures and proves each disclosure guard (missing embed / label /
        # note / over-budget) still refuses what it exists to refuse.
        run: ./scripts/readme-gate.sh --selftest

  site-build:
    # The same generator Vercel runs (vercel.json pins it), so this catches a
    # broken deploy on the PR instead of after merge. It also link-checks every
    # product page: the build fails on any local reference that does not
    # resolve. Ungated for the same reason design-docs is — one small npm
    # install, seconds to run, and always reporting keeps it usable as a
    # required check. It waits on `regen` for the same reason design-docs
    # does: the site renders the product pages and previews regen produces,
    # and a link check against the pre-regen tree would fail on artifacts
    # that exist by the time the run ends.
    name: Static site builds
    needs: regen
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ needs.regen.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        run: npm --prefix site ci
      # Runs before the build so a lineage disagreement is reported as what it
      # is, rather than as whatever the index happens to render. These tests
      # cross-check site/lib/lineage.mjs against tools/lineage by running both
      # over the same fixture trees — the site cannot call the Python resolver
      # (Vercel installs npm deps only), so it ports it, and nothing else
      # notices when a port drifts. python3 is preinstalled on this runner.
      - name: Run the site unit tests
        run: npm --prefix site test
      - name: Build the site (fails on any broken local reference)
        run: node site/build.mjs --out build/site
      - name: Upload the built site
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: build/site
          if-no-files-found: error

  scad-check:
    name: OpenSCAD syntax/geometry check
    # Waits on regen because check.sh runs docs-check.sh, which asserts the
    # README gallery is not stale — and regenerating that gallery is now
    # regen's job. Checking the pre-regen tree would fail on a gallery the
    # same run is about to fix.
    needs: [changes, regen]
    if: ${{ !cancelled() && needs.changes.outputs.scad == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ needs.regen.outputs.sha }}
      - name: Install OpenSCAD (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: openscad openscad-mcad xvfb
          # cache key; bump to pull fresh package versions (e.g. after a
          # runner-image rollover or when apt security updates matter)
          version: "2026-08"
      - name: Run check.sh
        run: ./scripts/check.sh

  # Same checks against the OpenSCAD dev snapshot with the Manifold
  # backend — the engine render-gate uses. The stable job above stays the
  # compatibility baseline (2021.01 is what most users run); this job
  # catches nightly-only regressions before they surprise the gate.
  scad-check-nightly:
    name: OpenSCAD syntax/geometry check (nightly, manifold)
    needs: [changes, regen]
    if: ${{ !cancelled() && needs.changes.outputs.scad == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ needs.regen.outputs.sha }}
      - name: Install xvfb (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: xvfb
          version: "2026-08"
      - name: Install OpenSCAD nightly (OBS repo)
        run: |
          echo 'deb https://download.opensuse.org/repositories/home:/t-paul/xUbuntu_24.04/ /' \
            | sudo tee /etc/apt/sources.list.d/openscad-nightly.list
          curl -fsSL 'https://download.opensuse.org/repositories/home:/t-paul/xUbuntu_24.04/Release.key' \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/openscad-nightly.gpg
          sudo apt-get update
          sudo apt-get install -y openscad-nightly
          openscad-nightly --version
      - name: Run check.sh (manifold backend)
        env:
          OPENSCAD_BIN: openscad-nightly
          OPENSCAD_ARGS: --backend=manifold
        run: ./scripts/check.sh

  render-gate:
    name: Render designs, gate STLs, test-slice
    needs: changes
    if: needs.changes.outputs.gate == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install xvfb, PrusaSlicer and f3d (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          # PrusaSlicer stays on the Ubuntu package: upstream stopped
          # shipping Linux binaries after 2.9.0 (Flatpak-only now), so
          # apt 2.7.x is the newest CI-practical build. f3d likewise uses
          # the Ubuntu package (2.2.x; upstream 3.x ships .debs if we ever
          # need newer) — it only renders artifact previews here.
          packages: xvfb prusa-slicer f3d
          # cache key; bump to pull fresh package versions (see scad-check)
          version: "2026-08"
      - name: Install OpenSCAD nightly (OBS repo)
        # Dev snapshots render with the Manifold backend — order-of-
        # magnitude faster than 2021.01's CGAL on these models. The stable
        # binary remains covered by the scad-check job.
        run: |
          echo 'deb https://download.opensuse.org/repositories/home:/t-paul/xUbuntu_24.04/ /' \
            | sudo tee /etc/apt/sources.list.d/openscad-nightly.list
          curl -fsSL 'https://download.opensuse.org/repositories/home:/t-paul/xUbuntu_24.04/Release.key' \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/openscad-nightly.gpg
          sudo apt-get update
          sudo apt-get install -y openscad-nightly
          openscad-nightly --version
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install printcheck
        run: pip install -e tools/printcheck
      - name: Prove the derivative gate can still fire
        # The gate's derivative check rests entirely on two undocumented
        # OpenSCAD behaviours: a redefinition that binds nothing is reported
        # nowhere, and the mesh it leaves behind is byte-identical to the
        # parent's. Both were measured on 2021.01; this job renders on the
        # dev snapshot with the Manifold backend, where neither is promised.
        # The selftest renders fixtures carrying a working override and a
        # typo'd one and asserts the comparison still separates them.
        #
        # Ahead of the gate, and blocking, because a gate that has silently
        # stopped firing is indistinguishable from a gate with nothing to
        # report — every derivative below would pass by saying nothing. It
        # costs seconds: four small fixtures, no printcheck, no slicer.
        env:
          OPENSCAD_BIN: openscad-nightly
          OPENSCAD_ARGS: --backend=manifold
        run: ./scripts/lineage.sh selftest
      - name: Render, gate with printcheck, test-slice with PrusaSlicer
        env:
          GATE_DESIGNS: ${{ needs.changes.outputs.gate_designs }}
          OPENSCAD_BIN: openscad-nightly
          OPENSCAD_ARGS: --backend=manifold
        # pipefail: the default Actions shell is `bash -e` WITHOUT pipefail,
        # so without it tee would mask gate.sh failures.
        run: |
          set -o pipefail
          if [ "$GATE_DESIGNS" = ALL ]; then
            ./scripts/gate.sh --slice | tee gate.log
          else
            echo "gating changed designs only: $GATE_DESIGNS"
            # word splitting of the design list is intended
            # shellcheck disable=SC2086
            ./scripts/gate.sh --slice $GATE_DESIGNS | tee gate.log
          fi
      - name: Write job summary
        if: always()
        run: |
          python3 scripts/gate-summary.py gate.log > gate-summary.md \
            || echo '_no gate output captured_' > gate-summary.md
          cat gate-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upsert sticky PR comment
        # Same-repo PRs only: fork PR tokens are read-only and the comment
        # would fail; this repo's PRs all come from session branches anyway.
        #
        # !cancelled() rather than always(): a run superseded by the next
        # push (concurrency cancels it mid-gate) would otherwise overwrite a
        # complete report with a truncated one — the log stops mid-part, so
        # the table renders the in-flight part as "no printcheck score" and
        # silently drops every part after it. Leave the previous comment
        # standing; the superseding run posts the real result.
        if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- printcheck-gate-report -->';
            let report;
            try {
              report = fs.readFileSync('gate-summary.md', 'utf8');
            } catch {
              report = '_gate produced no summary (job failed before printcheck ran)_';
            }
            // !cancelled() on the step is evaluated before the step starts,
            // so it cannot stop a run cancelled (or simply overtaken) once
            // this script is already in flight — that run would finish its
            // API calls and overwrite the newer run's report with stale
            // output. Check we are still the PR head twice: once up front to
            // skip the listComments call entirely, and again immediately
            // before the write, since a push during the (paginated) list is
            // the wider window of the two.
            //
            // This shrinks the race, it cannot remove it: there is no
            // conditional-write primitive on the comments API, so some gap
            // between the last check and the write always remains. The body
            // carries the SHA it was built from, and the next run rewrites
            // the comment, so a lost race is visible and self-correcting.
            const built = context.payload.pull_request.head.sha;
            const stillCurrent = async () => {
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo, pull_number: context.issue.number,
              });
              if (pr.head.sha === built) return true;
              core.info(`superseded: PR head is ${pr.head.sha.slice(0, 7)}, `
                + `this run built ${built.slice(0, 7)} — leaving the comment alone`);
              return false;
            };
            if (!await stillCurrent()) return;
            const sha = built.slice(0, 7);
            // Name the artifacts: the f3d renders are the only view of the
            // exported meshes these numbers describe, and an artifact nobody
            // is pointed at may as well not exist (geo-diff's comment names
            // its own renders for the same reason).
            // "when f3d succeeded": this step runs BEFORE the f3d render and
            // its upload, and that upload is if-no-files-found: warn, so a
            // render that produced nothing leaves no stl-renders artifact.
            // Hedged wording beats reordering the steps to find out.
            const body = `${marker}\n${report}\n`
              + `_The meshes behind these numbers are in the \`stls\` artifact, `
              + `and their renders in \`stl-renders\` when f3d succeeded. `
              + `Automated report for ${sha}._`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const prev = comments.find(c => c.body && c.body.startsWith(marker));
            if (!await stillCurrent()) return;
            if (prev) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: prev.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }
      - name: Render gated STLs with f3d
        # Previews of the exported STLs — the meshes printcheck and the
        # slicer actually see — as opposed to the OpenSCAD source-level
        # contact sheets (which show modifier colors and assembled poses,
        # not export artifacts). Non-blocking while f3d proves itself in
        # this pipeline (issue #22).
        if: always()
        continue-on-error: true
        run: |
          mkdir -p stl-renders
          shopt -s nullglob
          for stl in build/*.stl; do
            base="$(basename "${stl%.stl}")"
            xvfb-run -a f3d "$stl" --output="stl-renders/${base}.png" \
              --resolution=1200,900 2>/dev/null \
              || echo "f3d failed on ${stl} (non-blocking)"
          done
      - name: Upload STL renders
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: stl-renders
          path: stl-renders/*.png
          if-no-files-found: warn
      - name: Upload STLs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: stls
          path: build/*.stl
          if-no-files-found: error

  # Geometric diff of the rendered STLs, base vs head, on design PRs:
  # bodies added/removed/modified, volume/mass deltas, interference —
  # posted as a second sticky comment. argus-diff is v0.1.x (weeks old at
  # adoption), so the whole job is continue-on-error and gates nothing;
  # revisit --fail-on-interference once it proves stable (issue #21).
  geo-diff:
    name: Geometric STL diff (argus-diff, non-blocking)
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.gate == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # full history so the merge base with the base branch is reachable
          fetch-depth: 0
      - name: Check out the merge base for comparison renders
        # Deliberately the merge base, not `ref: github.base_ref` — that
        # resolves to the base branch's MOVING TIP, so once main advances
        # past this PR's fork point the diff would attribute other people's
        # merges to this PR. The merge base is what `git diff main...HEAD`
        # compares against, and what the `changes` job above already uses.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base_sha="$(git merge-base "origin/${BASE_REF}" HEAD)"
          echo "diffing against merge base ${base_sha}"
          git worktree add base "$base_sha"
      - name: Install xvfb (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: xvfb
          version: "2026-08"
      - name: Install OpenSCAD nightly (OBS repo)
        # Same engine as render-gate so base and head render identically.
        run: |
          echo 'deb https://download.opensuse.org/repositories/home:/t-paul/xUbuntu_24.04/ /' \
            | sudo tee /etc/apt/sources.list.d/openscad-nightly.list
          curl -fsSL 'https://download.opensuse.org/repositories/home:/t-paul/xUbuntu_24.04/Release.key' \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/openscad-nightly.gpg
          sudo apt-get update
          sudo apt-get install -y openscad-nightly
          openscad-nightly --version
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install argus-diff
        run: pip install 'argus-diff[render]'
      - name: Render base + head parts, diff each
        env:
          GATE_DESIGNS: ${{ needs.changes.outputs.gate_designs }}
          OPENSCAD_BIN: openscad-nightly
          OPENSCAD_ARGS: --backend=manifold
        run: |
          set -o pipefail
          mkdir -p argus-renders head-stl base-stl
          : > argus-report.md
          read -ra osc_args <<<"$OPENSCAD_ARGS"

          render_part() {  # root name part outdir -> 0/1
            local root="$1" name="$2" part="$3" outdir="$4"
            local src="${root}/designs/${name}/${name}.scad"
            [ -f "$src" ] || return 1
            local dargs=()
            [ -n "$part" ] && dargs=(-D "part=\"${part}\"")
            # same search path the scripts export: lib/ for shared modules,
            # the tree root for `include <styles/<name>/style.scad>`
            OPENSCADPATH="${root}/lib:${root}" xvfb-run -a "$OPENSCAD_BIN" \
              "${osc_args[@]}" -o "${outdir}/${name}${part:+-$part}.stl" \
              "${dargs[@]}" "$src"
          }

          if [ "$GATE_DESIGNS" = ALL ] || [ -z "$GATE_DESIGNS" ]; then
            designs="$(for d in designs/*/; do
              n="$(basename "$d")"
              [ -f "designs/$n/$n.scad" ] && echo "$n"
            done)"
          else
            designs="$(tr ' ' '\n' <<<"$GATE_DESIGNS")"
          fi

          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if [ -f "designs/${name}/ci.parts" ]; then
              # `|| true`: grep exits 1 on a comment-only file, and the
              # default Actions shell is `bash -e` (same guard gate.sh uses)
              parts="$(grep -vE '^(#|$)' "designs/${name}/ci.parts" || true)"
            else
              parts=""
            fi
            # empty part = the design's default render
            printf '%s\n' "${parts:-''}" | while IFS= read -r part; do
              [ "$part" = "''" ] && part=""
              label="${name}${part:+-$part}"
              if ! render_part . "$name" "$part" head-stl; then
                echo "skip ${label}: head render failed"; continue
              fi
              # A missing base source is a genuinely new design; a base
              # source that fails to render is a signal worth reporting, not
              # something to mislabel as new.
              if [ ! -f "base/designs/${name}/${name}.scad" ]; then
                {
                  echo "### \`${label}\`"
                  echo
                  echo "_new on this PR (no base version to diff against)_"
                  echo
                } >> argus-report.md
                continue
              fi
              if ! render_part base "$name" "$part" base-stl; then
                {
                  echo "### \`${label}\`"
                  echo
                  echo "_base render failed — no diff produced (see job log)_"
                  echo
                } >> argus-report.md
                continue
              fi
              out="$(xvfb-run -a argus diff \
                "base-stl/${label}.stl" "head-stl/${label}.stl" \
                --density 1.24 --render "argus-renders/${label}.png" \
                2>&1)" || true
              {
                echo "### \`${label}\`"
                echo
                echo '```'
                echo "$out"
                echo '```'
                echo
              } >> argus-report.md
            done
          done <<<"$designs"
      - name: Upload diff renders
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: argus-diff-renders
          path: argus-renders/*.png
          if-no-files-found: ignore
      - name: Upsert sticky PR comment
        # Same-repo PRs only, same reason as render-gate's sticky comment.
        # !cancelled() for the same reason too: a cancelled run has no
        # argus-report.md, so always() would replace a good geometric diff
        # with "job failed before diffing" every time a push supersedes a
        # run in flight.
        if: >-
          !cancelled() &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- argus-diff-report -->';
            let report;
            try {
              report = fs.readFileSync('argus-report.md', 'utf8');
            } catch {
              report = '_argus-diff produced no report (job failed before diffing)_';
            }
            if (!report.trim()) {
              report = '_no gated parts to diff on this PR_';
            }
            // Same stale-run guard as render-gate's sticky comment, with the
            // same two call sites and the same caveat: the step-level
            // !cancelled() cannot stop an already-running script, and no
            // conditional-write primitive exists, so this narrows the race
            // rather than closing it.
            const built = context.payload.pull_request.head.sha;
            const stillCurrent = async () => {
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo, pull_number: context.issue.number,
              });
              if (pr.head.sha === built) return true;
              core.info(`superseded: PR head is ${pr.head.sha.slice(0, 7)}, `
                + `this run built ${built.slice(0, 7)} — leaving the comment alone`);
              return false;
            };
            if (!await stillCurrent()) return;
            const sha = built.slice(0, 7);
            const body = `${marker}\n### Geometric diff vs base (non-blocking)\n` +
              `${report}\n_Before/after/overlay renders are in the ` +
              `argus-diff-renders artifact. Automated report for ${sha}._`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const prev = comments.find(c => c.body && c.body.startsWith(marker));
            if (!await stillCurrent()) return;
            if (prev) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: prev.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }
