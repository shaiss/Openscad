name: Smart CI gate approval

# The human half of Smart CI, driven entirely by GitHub-native signals: a
# maintainer comments `/ci-gate approve <id>` (or decline / list) on a PR, and
# this workflow authorizes them by their real repository permission, flips the
# gate's state in the committed registry, and pushes that one-line change back
# to the PR branch. The decision lives in git — reproducible, diffable, carried
# by a clone — while GitHub supplies the interaction and the authorization.
#
# Push uses REGEN_TOKEN (a fine-grained PAT with contents:write), the same
# secret the regen job uses and for the same reason: a GITHUB_TOKEN push
# triggers no workflow, so CI would never re-run against the newly-enabled
# gate. With the PAT the registry commit re-triggers CI, and smart-ci runs the
# gate the maintainer just crossed.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write         # react to the command, reply with the result
  pull-requests: read

concurrency:
  # Serialize commands on one PR so two approvals cannot race the push.
  group: ci-gate-approve-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  approve:
    name: Apply a /ci-gate command
    # Only PR comments that start with the command word. The heavy validation
    # (permission, same-repo head, known gate) happens in the parse step so it
    # can post a helpful reply rather than silently no-op.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/ci-gate')
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/tools/ci-gates/src
    steps:
      - name: Authorize and parse the command
        id: parse
        uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.comment.body.trim();
            const m = body.match(/^\/ci-gate\s+(approve|decline|list)(?:\s+(\S+))?\s*$/);
            const react = (content) => github.rest.reactions.createForIssueComment({
              ...context.repo, comment_id: context.payload.comment.id, content,
            });
            const reply = (msg) => github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: `${msg}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`,
            });
            if (!m) {
              await react('confused');
              await reply(
                '**/ci-gate** — usage:\n'
                + '```\n/ci-gate approve <id>\n/ci-gate decline <id>\n/ci-gate list\n```'
              );
              core.setOutput('valid', 'false');
              return;
            }
            const [, action, gateId] = m;
            if (action !== 'list' && !gateId) {
              await react('confused');
              await reply(`**/ci-gate ${action}** needs a gate id, e.g. \`/ci-gate ${action} shellcheck\`.`);
              core.setOutput('valid', 'false');
              return;
            }
            // Native authorization: the commenter's real permission on this
            // repo. write/maintain/admin may change what CI enforces; everyone
            // else is refused.
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: context.payload.comment.user.login,
            });
            if (!['admin', 'maintain', 'write'].includes(perm.permission)) {
              await react('-1');
              await reply(
                `@${context.payload.comment.user.login} — \`/ci-gate\` needs write access `
                + `to this repository (you have \`${perm.permission}\`).`
              );
              core.setOutput('valid', 'false');
              return;
            }
            // The PR head branch we must edit and push. A fork head is
            // unpushable, so decline approve/decline there (list is fine).
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.issue.number,
            });
            const sameRepo = pr.head.repo && pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            if (action !== 'list' && !sameRepo) {
              await react('-1');
              await reply(
                'This PR is from a fork, so CI cannot push the registry change to its '
                + 'branch. Edit `.github/ci-gates/registry.conf` in the PR to cross the gate instead.'
              );
              core.setOutput('valid', 'false');
              return;
            }
            await react('eyes');
            core.setOutput('valid', 'true');
            core.setOutput('action', action);
            core.setOutput('gate_id', gateId || '');
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_repo', pr.head.repo.full_name);

      - name: Check out the PR branch
        if: steps.parse.outputs.valid == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.parse.outputs.head_ref }}
          # PAT so the registry commit re-triggers CI (see the header note).
          token: ${{ secrets.REGEN_TOKEN || github.token }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        if: steps.parse.outputs.valid == 'true'
        with:
          python-version: '3.12'

      - name: List gates
        id: list
        if: steps.parse.outputs.valid == 'true' && steps.parse.outputs.action == 'list'
        run: |
          {
            echo 'summary<<EOF'
            python -m ci_gates list
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Apply approve / decline
        id: apply
        if: >-
          steps.parse.outputs.valid == 'true' &&
          steps.parse.outputs.action != 'list'
        env:
          ACTION: ${{ steps.parse.outputs.action }}
          GATE_ID: ${{ steps.parse.outputs.gate_id }}
          HEAD_REF: ${{ steps.parse.outputs.head_ref }}
          HAVE_PAT: ${{ secrets.REGEN_TOKEN != '' }}
        run: |
          set -euo pipefail
          # Mutate the registry. A non-zero exit here (unknown gate, advisory
          # parked as proposed) is reported to the commenter by the reply step.
          if ! out="$(python -m ci_gates "$ACTION" "$GATE_ID" 2>&1)"; then
            echo "result<<EOF" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$out" >> "$GITHUB_OUTPUT"
            echo EOF >> "$GITHUB_OUTPUT"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$out"
          if git diff --quiet -- .github/ci-gates/registry.conf; then
            # No change (already in that state) — nothing to push.
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            { echo "result<<EOF"; printf '%s\n' "$out"; echo EOF; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/ci-gates/registry.conf
          git commit -m "ci-gate: ${ACTION} ${GATE_ID}"
          # Push to the PR head branch from the parse step — NOT
          # $GITHUB_REF_NAME, which on an issue_comment event is the default
          # branch, not the PR's branch.
          n=0
          until git push origin "HEAD:refs/heads/${HEAD_REF}"; do
            n=$((n+1)); [ "$n" -ge 4 ] && { echo "push failed after retries"; exit 1; }
            sleep $((2 ** n))
          done
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          { echo "result<<EOF"; printf '%s\n' "$out"; echo EOF; } >> "$GITHUB_OUTPUT"
          if [ "$HAVE_PAT" != "true" ]; then
            echo "no_pat=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reply with the result
        if: steps.parse.outputs.valid == 'true' && !cancelled()
        uses: actions/github-script@v8
        env:
          ACTION: ${{ steps.parse.outputs.action }}
          GATE_ID: ${{ steps.parse.outputs.gate_id }}
          LIST: ${{ steps.list.outputs.summary }}
          RESULT: ${{ steps.apply.outputs.result }}
          OK: ${{ steps.apply.outputs.ok }}
          PUSHED: ${{ steps.apply.outputs.pushed }}
          NO_PAT: ${{ steps.apply.outputs.no_pat }}
        with:
          script: |
            const { ACTION, GATE_ID, LIST, RESULT, OK, PUSHED, NO_PAT } = process.env;
            const footer = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
            const react = (content) => github.rest.reactions.createForIssueComment({
              ...context.repo, comment_id: context.payload.comment.id, content,
            });
            let body;
            if (ACTION === 'list') {
              body = `**Smart CI gate registry**\n\n\`\`\`\n${LIST || '(empty)'}\n\`\`\``;
              await react('+1');
            } else if (OK === 'false') {
              body = `Could not \`${ACTION}\` \`${GATE_ID}\`:\n\n\`\`\`\n${RESULT || 'unknown error'}\n\`\`\``;
              await react('-1');
            } else {
              const pushed = PUSHED === 'true'
                ? 'Pushed the registry change to this branch; CI will re-run and enforce the new selection.'
                : 'No change — the gate was already in that state.';
              const patWarn = NO_PAT === 'true'
                ? '\n\n> ⚠️ REGEN_TOKEN is not set, so this push used GITHUB_TOKEN and will **not** re-trigger CI. Push any commit to re-run.'
                : '';
              body = `\`${GATE_ID}\`: ${RESULT ? RESULT.trim() : ACTION}. ${pushed}${patWarn}`;
              await react('+1');
            }
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number, body: body + footer,
            });
