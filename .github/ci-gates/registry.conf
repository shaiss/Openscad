# Smart CI — gate-selection registry.
#
# The `changes` job in ci.yml deterministically selects which of the EXISTING
# gates run for a PR. This file is the second layer: candidate gates the
# selector can PROPOSE from a PR's changed files, and the record of what a
# human (or the auto-approve policy) decided about each. It is the reproducible
# source of truth — it lives in git, travels with a clone, and every run reads
# it the same way. GitHub is only the interaction surface (the /ci-gate command
# and the sticky PR comment); the decision itself is this file's `state`.
#
# One stanza per candidate gate:
#
#   tier  = advisory   cheap and non-blocking. Auto-approved: it runs whenever
#                      it applies, no human step (issue: a mis-fire only warns).
#           gating      can FAIL a PR. Stays a proposal until a human crosses it,
#                      so a new blocking check never lands on people unannounced.
#   state = on         active — the selector RUNS this gate on every PR it
#                      applies to. (advisory default; set for a crossed gating.)
#           proposed   applies, but not yet approved — surfaced in the PR comment
#                      with the command to cross it. (gating default.)
#           off        declined — never run, never propose again.
#   title = one line describing what the gate checks (shown in the PR comment).
#   run   = the command the selector runs when the gate is active, from the repo
#           root. Advisory: exit code is advisory (non-blocking). Gating: a
#           non-zero exit fails the smart-ci job.
#   setup = optional command run before `run` when the gate is active (install a
#           tool the runner does not already have). Omit if none is needed.
#   cross = what a maintainer does to approve it — the exact /ci-gate command.
#
# A gate with no stanza here falls back to its tier default (advisory -> on,
# gating -> proposed), so adding an advisory detector needs no edit here; a new
# gating detector is proposed until someone crosses it.
#
# Cross a proposal straight from the PR:
#     /ci-gate approve <id>      wire it in for this and every future run
#     /ci-gate decline <id>      set state=off so it stops being proposed
#     /ci-gate list              show the current selection
# A maintainer with write access runs the command; the approve workflow flips
# the state below and commits it back to the PR branch.

[classifier-coverage]
tier  = advisory
state = on
title = New top-level directory is not covered by the `changes` classifier
run   = python -m ci_gates run classifier-coverage
cross = add a case arm for the directory in ci.yml's `changes` job (advisory)

[shellcheck]
tier  = gating
state = proposed
title = Lint shell scripts with shellcheck
run   = shellcheck -x scripts/*.sh .claude/hooks/*.sh
cross = /ci-gate approve shellcheck

[actionlint]
tier  = gating
state = proposed
title = Lint GitHub Actions workflows with actionlint
setup = mkdir -p ./.actionlint-bin && bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/03d0035246f3e81f36aed592ffb4bebf33a03106/scripts/download-actionlint.bash) 1.7.7 ./.actionlint-bin
run   = ./.actionlint-bin/actionlint -color
cross = /ci-gate approve actionlint
