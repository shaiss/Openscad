[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "printcheck"
version = "0.1.0"
description = "STL printability analysis: geometric heuristics for FDM 3D printing, with optional AI summary on top"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "trimesh>=4.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "shapely>=2.0",
    "rtree>=1.0",
    "manifold3d>=2.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
test = ["pytest>=7"]

[project.scripts]
printcheck = "printcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
