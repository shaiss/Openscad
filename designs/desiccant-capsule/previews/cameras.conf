# Frozen preview shots — rendered by `./scripts/render.sh desiccant-capsule
# --previews`, format documented in scripts/render.sh. Cameras are FIXED across
# review rounds: add a new entry rather than moving an existing one.
#
# This design predates the cameras.conf convention (its previews were committed
# by hand in #1), so only the shots whose framing is defined by the toolchain
# rather than by a remembered camera can be listed here. The contact sheet is
# one: its four views are built into render.sh, so re-rendering it reproduces
# the committed framing exactly rather than guessing at it.
#
# assembly.png, cutaway.png and vents-closeup.png are NOT here, and cannot be
# added without inventing camera parameters that would reframe them — which the
# frozen-camera rule exists to prevent. See issue #69.
contact-sheet
