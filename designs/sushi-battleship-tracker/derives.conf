# Lineage of sushi-battleship-tracker — shot-tracker refit of the archived
# sushi-battleship (frozen at v0.1; a derivative is the revival path its
# ARCHIVED marker prescribes).  Format: tools/lineage; background:
# docs/derivative-designs.md.  Validate with ./scripts/lineage.sh check.

# Single parent, in include order (one parent, so no diamond is possible).
variant-of:    sushi-battleship

# The parent parts this design actually changes, proven by mesh comparison
# in gate.sh: door() is redefined (the miss-marker seat), and the top
# carries all 16 doors captive, so both meshes move.  The bottom (tray) is
# inherited unchanged and deliberately NOT claimed — a claimed part whose
# mesh matches the parent's is indistinguishable from an override that
# never bound, and fails the gate.
replaces:      sushi-battleship:top, sushi-battleship:door
